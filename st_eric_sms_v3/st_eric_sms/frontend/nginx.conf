server {
  listen 80;
  client_max_body_size 55m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 800;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 120s; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
